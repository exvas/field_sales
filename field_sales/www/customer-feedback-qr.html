{% extends "templates/web.html" %}
{% set feedback_url = frappe.utils.get_url("/customer-feedback") %}
{% block title %}Customer Feedback{% endblock %}
{% block page_content %}
<div style="max-width:600px;margin:60px auto;text-align:center;font-family:system-ui,sans-serif;">
  <h1 style="margin-bottom:8px;color:#c8102e;">Customer Feedback</h1>
  <p style="color:#6b6b6b;margin-bottom:32px;">Scan to share your experience.</p>

  <img
    src="https://api.qrserver.com/v1/create-qr-code/?size=320x320&margin=10&data={{ feedback_url | urlencode }}"
    alt="Scan to open the Customer Feedback form"
    style="width:320px;height:320px;border:1px solid #eee;padding:12px;background:#fff;border-radius:8px;display:inline-block;"
  />

  <p style="margin-top:24px;font-size:13px;color:#666;word-break:break-all;">
    <a href="{{ feedback_url }}" style="color:#c8102e;text-decoration:none;">{{ feedback_url }}</a>
  </p>

  <p style="margin-top:32px;">
    <button onclick="window.print()"
      style="padding:10px 24px;border:1px solid #c8102e;background:#c8102e;color:white;border-radius:6px;cursor:pointer;font-weight:600;">
      Print this page
    </button>
  </p>
</div>
<style>@media print { button { display: none !important; } a { color: #000 !important; } }</style>
{% endblock %}
